[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stealth-camp-check"
version = "0.1.0"
description = "Check stealth camping and overnight parking rules by US state — rest areas, BLM land, city streets."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "CarSteader", email = "info@carsteader.com"}]
keywords = ["stealth-camping", "overnight-parking", "van-life", "rest-area", "blm", "camping-rules"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
requires-python = ">=3.8"
dependencies = []

[project.scripts]
sccheck = "stealth_camp_check.cli:main"
stealth-camp-check = "stealth_camp_check.cli:main"

[project.urls]
Homepage = "https://carsteader.com/tools/stealth-camp-check/"
Repository = "https://github.com/wwallace603-rgb/stealth-camp-check"
"Legal Camping Rules by State" = "https://carsteader.com/legal-stealth-camping-usa/"
"Stealth Camping Gear List" = "https://carsteader.com/stealth-camping-gear-list/"

[tool.setuptools.packages.find]
include = ["stealth_camp_check*"]

[tool.setuptools.package-data]
stealth_camp_check = ["*.json"]
